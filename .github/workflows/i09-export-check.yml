name: PDF engine検証
on:
  push:
    branches: ['codex/i09-pdf-validation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/engine-probe
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.2
          working_directory: tools/engine-probe
          install_args: python pandoc typst
      - name: PDF検証専用の依存を導入
        run: python -m pip install -r ../../requirements/pdf-test.txt
      - name: 固定公開font/OFLだけを取得
        run: |
          PYTHONPATH=../../src python - <<'PY'
          import os
          from pathlib import Path
          from signal_library.initialization import initialize
          from signal_library.exports.fonts import install, CACHE
          root=Path(os.environ['RUNNER_TEMP'])/'signal-i09-fonts'
          initialize(str(root),True,False,Path.cwd())
          install(str(root),apply=True)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write('SIGNAL_LIBRARY_TEST_FONT_DIR='+str(root/CACHE)+'\n')
          PY
      - name: 実エンジンと実fontを必須として検証
        run: |
          PYTHONPATH=../../src python - <<'PY'
          import os
          from signal_library.exports.engine import Pandoc
          from signal_library.exports.typst import Typst
          from signal_library.exports.html import font_files
          print(Pandoc().version,Typst().version)
          font_files(os.environ['SIGNAL_LIBRARY_TEST_FONT_DIR'])
          PY
          python -m unittest discover -s ../../tests -p test_export_html.py
          python -m unittest discover -s ../../tests -p test_export_pdf.py
